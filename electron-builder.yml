appId: com.douweosinga.topgoose
productName: Top Goose
artifactName: Top-Goose-${version}-${arch}.${ext}
asar: true

directories:
  buildResources: resources
  output: dist

files:
  - out/**/*
  - package.json

mac:
  category: public.app-category.developer-tools
  hardenedRuntime: true
  icon: top-goose.png
  notarize: true
  target:
    - dmg
    - zip
